name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "Tests (Python ${{ matrix.python }}, pipecat ${{ matrix.pipecat }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        pipecat: ["pinned", "latest"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install development dependencies
        run: uv sync --group dev

      - name: Upgrade to latest Pipecat
        if: matrix.pipecat == 'latest'
        run: uv pip install --upgrade pipecat-ai

      - name: Run tests
        run: uv run pytest -q
